<!DOCTYPE html>
{% load static %}
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Job Hunt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/yeti/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&amp;display=swap">
    <link rel="stylesheet" href="{% static 'assets/css/Navbar-With-Button-icons.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/Testimonials-Centered-images.css' %}">
</head>
<style>
     body {
        background-color: rgb(236, 234, 231);
    }
</style>
<body>
    <nav class="navbar navbar-expand-md bg-dark-subtle py-3">
        <div class="container"><a class="navbar-brand d-flex align-items-center" href="{% url 'core:dashboard' %}"><span class="bs-icon-sm bs-icon-rounded bs-icon-primary d-flex justify-content-center align-items-center me-2 bs-icon">
            <i class="fas fa-regular fa-briefcase"></i>
        </span>
        <span>JOBHUNT</span></a><button data-bs-toggle="collapse" class="navbar-toggler"
                data-bs-target="#navcol-1"><span class="visually-hidden">Toggle navigation</span><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navcol-1">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="{% url 'core:dashboard' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'core:whsihlist' %}">Whishlist</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'core:offer' %}">Offers</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'core:rejected' %}">Rejected</a></li>
                {% if request.user.is_authenticated %}
                </ul><button class="btn btn-primary" type="button"
                    onclick="location.href=`{% url 'users:logout' %}`">Logout</button>
                {% else %}
                </ul><button class="btn btn-primary" type="button"
                    onclick="location.href=`{% url 'users:login'  %}`">Login</button>
                {% endif %}
            </div>
        </div>
    </nav>
    {% for message in messages %}
    <div class="container d-flex bottom-alert">
        <div class="alert {{ message.tags }} alert-dismissible shadow fade show " role="alert">
            <button type="button" class="btn close" data-bs-dismiss="alert" aria-label="Close">
                <i class="fas fa-trash"></i>
            </button>
            {{ message | safe }}
        </div>

    </div>

    {% endfor %}
    {% block content %}

    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.bundle.min.js"></script>
    <script src="{% static 'assets/js/bs-init.js' %}"></script>

</body>

</html>
