version: 0.2
env:
  secrets-manager:
    TOKEN: 23201550/Devops/prod:TOKEN
    HOST: 23201550/Devops/prod:HOST
    PROJECTKEY: 23201550/Devops/prod:PROJECTKEY
phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
      - unzip sonar-scanner-cli-5.0.1.3006-linux.zip
  build:
    commands:
      - ./sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner -Dsonar.projectKey=$PROJECTKEY -Dsonar.sources=. -Dsonar.host.url=$HOST -Dsonar.login=$TOKEN
      - sleep 5
      - curl http://18.201.85.9:9000/api/qualitygates/project_status?projectKey=$PROJECTKEY > result.json
      - cat result.json
      - if [ -s result.json ] && if [ $(jq -r '.projectStatus.status' result.json) = ERROR ] ; then exit 1 ;fi

